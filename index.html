  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('fr'), lock = $('lock'), pinEl = $('pin'), btn = $('go'), errEl = $('err'), msgEl = $('msg');
  var P = JSON.parse($('p').textContent);
  var CACHE = 'lifehub.aeskey.v1';
  var c = window.crypto || window.msCrypto || {};
  var subtle = c.subtle || c.webkitSubtle;

  function b64d(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function b64e(u) {
    var s = '', CH = 0x8000;
    for (var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
    return btoa(s);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function show(html) {
    frame.srcdoc = html;
    frame.style.display = 'block';
    lock.style.display = 'none';
  }
  function derive(pin) {
    return subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits'])
      .then(function (bk) {
        return subtle.deriveBits(
          { name: 'PBKDF2', salt: b64d(P.salt), iterations: P.iter, hash: 'SHA-256' }, bk, 256);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function decrypt(rawKey) {
    return subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function (k) {
        return subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.iv), tagLength: 128 }, k, b64d(P.ct));
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function unlock(rawKey, remember) {
    return decrypt(rawKey).then(function (html) {
      if (remember) lsSet(CACHE, b64e(rawKey));
      show(html);
    });
  }
  function askAgain(text) {
    msgEl.textContent = '';
    errEl.textContent = text;
    btn.disabled = false;
    pinEl.value = '';
    pinEl.focus();
  }
  function submit() {
    var pin = pinEl.value;
    if (!pin) { pinEl.focus(); return; }
    errEl.textContent = '';
    btn.disabled = true;
    msgEl.textContent = '解密中…';
    derive(pin)
      .then(function (rk) { return unlock(rk, true); })
      .catch(function () { askAgain('密码不对，再试一次'); });
  }

  if (!subtle) {
    lock.style.display = 'flex';
    errEl.textContent = '这个浏览器不支持 WebCrypto，请用 Safari 或 Chrome 打开。';
    btn.disabled = true;
    return;
  }

  btn.addEventListener('click', submit);
  pinEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  var cached = lsGet(CACHE);
  if (cached) {
    msgEl.textContent = '正在解锁…';
    unlock(b64d(cached), false).catch(function () {
      lsDel(CACHE);                      // 密码改过了，缓存失效，回到锁屏
      lock.style.display = 'flex';
      msgEl.textContent = '';
      setTimeout(function () { pinEl.focus(); }, 60);
    });
  } else {
    lock.style.display = 'flex';
    setTimeout(function () { pinEl.focus(); }, 60);
  }
})();
</script>
</body>
</html>

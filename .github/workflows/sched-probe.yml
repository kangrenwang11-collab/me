name: 定时探针（临时）

# 临时诊断用：验证公开库的 Actions 调度器会不会派发 schedule 事件。
# 和私有库 lifehub-data 里那个同名探针对照，用来判断「schedule 不触发」是
# 仓库可见性相关，还是整个账号的调度器都在排队。
# ⚠ 用完即删。公开库的 Actions 分钟数不计费。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报告触发信息
        run: |
          echo "repo=${{ github.repository }}"
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "beijing=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "PROBE OK"
